<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Julss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="acceso.css">
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>

<!-- Pantalla del código: al acertar redirige a index.html (la carta) -->
<section class="lock" id="lock">
  <div class="card">
    <!-- Candado dorado hecho con CSS: se abre al acertar -->
    <div class="padlock" id="padlock" aria-hidden="true"><span class="shackle"></span><span class="pl-body">♥</span></div>
    <h1 class="lock-title">Antes de abrir…</h1>
    <p class="lock-clue">Suma el día en que nació cada uno y multiplícalo por la suma de los meses en que nacimos.</p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="···" aria-label="Código">
      <button type="submit">Abrir</button>
    </form>
    <p class="lock-msg" id="lockMsg" aria-live="polite"></p>
  </div>
</section>

<script src="acceso.js"></script>
</body>
</html>
